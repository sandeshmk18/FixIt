<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to FixIt to manage bookings and account access securely." />
  <title>Login — FixIt</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="brand" aria-label="FixIt home">Fix<span>It</span></a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="services.html">Find Workers</a>
      <a href="register.html" class="btn-outline">List Yourself Free</a>
      <a href="login.html" class="btn-outline" data-auth-link>Login</a>
    </nav>
    <button type="button" class="hamburger" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileMenu">
      ☰
    </button>
  </header>

  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation" hidden>
    <a href="services.html">Find Workers</a>
    <a href="register.html">List Yourself Free</a>
  </nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="section-kicker">FIXIT ACCOUNT</span>
        <h1>Login to FixIt</h1>
        <p>Use your registered email and password to access account features.</p>
      </div>
    </section>

    <section class="auth-screen">
      <div class="auth-card">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </div>

          <div id="loginError" class="form-error" aria-live="polite"></div>

          <button type="submit" class="btn-primary btn-full">Login</button>
        </form>

        <p class="auth-subtext">
          No account yet? <a href="register.html">Register as a worker</a>
        </p>
      </div>
    </section>
  </main>

  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("loginEmail");
      const passwordInput = document.getElementById("loginPassword");
      const errorNode = document.getElementById("loginError");

      if (!loginForm) return;

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = (emailInput.value || "").trim();
        const password = passwordInput.value || "";

        errorNode.textContent = "";

        if (!email || !password) {
          errorNode.textContent = "Please enter both email and password.";
          return;
        }

        try {
          const result = await window.FixItAPI.loginUser(email, password);
          if (result && result.access_token) {
            const user = await window.FixItAPI.getCurrentUser();
            window.location.href = user && user.role === "admin" ? "admin.html" : "services.html";
          }
        } catch (error) {
          errorNode.textContent = error.message || "Unable to log in. Please try again.";
        }
      });
    });
  </script>
</body>
</html>
